<title>Macbeth Recall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single reading column, like a prompt book. Candle strip = mastery of all 24 lines. */
:root{
  --bg:#E8ECE5; --surface:#F6F7F2; --ink:#18201C; --muted:#56625B; --line:#C8D0C5;
  --accent:#875703; --accent-ink:#FFF8E6; --accent-soft:#EADDBF;
  --good:#2B6A42; --good-soft:#D2E7D8; --bad:#A0252C; --bad-soft:#F3D6D6; --warn:#7A5A10; --warn-soft:#F1E6C6;
  --f-display:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-body:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111714; --surface:#19211D; --ink:#E3E7DF; --muted:#98A49C; --line:#2C3731;
  --accent:#DCAB4C; --accent-ink:#1B1406; --accent-soft:#3A3020;
  --good:#76C694; --good-soft:#1C3326; --bad:#EC7A80; --bad-soft:#3C1E22; --warn:#E3C06A; --warn-soft:#3A321C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211D; --ink:#E3E7DF; --muted:#98A49C; --line:#2C3731;
  --accent:#DCAB4C; --accent-ink:#1B1406; --accent-soft:#3A3020;
  --good:#76C694; --good-soft:#1C3326; --bad:#EC7A80; --bad-soft:#3C1E22; --warn:#E3C06A; --warn-soft:#3A321C; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}

/* header */
header{display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(40px,8vw,58px);line-height:1}
h1 em{color:var(--accent)}
.tag{font-size:16px;color:var(--muted);max-width:52ch}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:400;line-height:1}
.stat span{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.candles{display:grid;grid-template-columns:repeat(24,1fr);gap:4px;align-items:end;height:44px;margin-top:4px}
.candle{position:relative;height:100%;border:1px solid var(--line);border-radius:3px 3px 2px 2px;background:var(--surface);overflow:hidden}
.candle i{position:absolute;left:0;right:0;bottom:0;background:var(--accent);transition:height .4s ease}
.candle.due{border-color:var(--accent)}
.candlekey{display:flex;justify-content:space-between;gap:8px}
@media (max-width:560px){.candlekey span:nth-child(2){display:none}}

/* home */
.today{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.today h2{font-size:30px}
.today p{margin:4px 0 0;opacity:.8;max-width:44ch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.today .btn.primary{padding:13px 24px;font-size:18px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.mode:hover{border-color:var(--accent)}
.mode h3{font-size:24px}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .mono{margin-top:4px}
.why{border-top:1px solid var(--line);padding-top:14px;font-size:15px;color:var(--muted)}
.why b{color:var(--ink)}

/* play surfaces */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.back{background:none;border:none;padding:6px 0;color:var(--muted);font-family:var(--f-mono);font-size:13px;letter-spacing:.06em}
.back:hover{color:var(--ink)}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,4vw,30px);display:flex;flex-direction:column;gap:16px;min-width:0}
.kind{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.quote{font-family:var(--f-display);font-style:italic;font-size:clamp(24px,4.6vw,34px);line-height:1.25;margin:0;text-wrap:pretty}
.quote u{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--accent)}
.quote.sm{font-size:21px}
.who{font-family:var(--f-mono);font-size:13px;color:var(--muted);letter-spacing:.04em}
.who b{color:var(--ink);font-weight:500}
.cue{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.cue dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.cue dd{margin:0}
.lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
textarea,input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.ok{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.chip.miss{background:transparent;border:1px dashed var(--warn);color:var(--warn)}
.chip.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink);text-decoration:line-through}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.answer{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.diff span{border-radius:3px;padding:0 1px}
.diff .hit{color:var(--good)}
.diff .gap{background:var(--bad-soft);color:var(--bad)}
.score{font-family:var(--f-mono);font-size:13px;padding:3px 10px;border-radius:999px;display:inline-block}
.score.good{background:var(--good-soft);color:var(--good)}
.score.mid{background:var(--warn-soft);color:var(--warn)}
.score.low{background:var(--bad-soft);color:var(--bad)}
.kw .hit{background:var(--good-soft);color:var(--good);border-radius:3px;padding:0 3px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.grade b{font-weight:700}
.grade small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.grade.g1:hover,.grade.g1.sugg{border-color:var(--bad)}
.grade.g2:hover,.grade.g2.sugg{border-color:var(--warn)}
.grade.g3:hover,.grade.g3.sugg{border-color:var(--good)}
.grade.sugg{box-shadow:0 0 0 2px var(--accent-soft)}

/* gap fill */
.gapq input{display:inline-block;width:auto;min-width:5ch;font-family:var(--f-display);font-style:italic;font-size:.9em;padding:2px 8px;border-radius:6px;border:none;border-bottom:2px solid var(--accent);background:var(--accent-soft);vertical-align:baseline;max-width:100%}
.gapq input.ok{background:var(--good-soft);border-color:var(--good)}
.gapq input.bad{background:var(--bad-soft);border-color:var(--bad)}
.fix{font-family:var(--f-mono);font-size:13px;color:var(--bad)}

/* option grids */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts.acts{grid-template-columns:repeat(5,1fr)}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px;text-align:left;font-weight:500;display:flex;gap:8px;align-items:baseline}
.opts.acts .opt{justify-content:center;font-family:var(--f-display);font-size:22px;font-weight:400}
.opt kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.timer{font-family:var(--f-display);font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.timer.low{color:var(--bad)}

/* tiles (hunt, order, exam) */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px 14px 12px 44px;font-family:var(--f-display);font-style:italic;font-size:18px;line-height:1.3;min-width:0}
.tile .mark{position:absolute;left:12px;top:12px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);font-family:var(--f-mono);font-style:normal;font-size:12px;display:grid;place-items:center;color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--ink)}
.tile[aria-pressed="true"] .mark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tile.ok{background:var(--good-soft);border-color:var(--good)}
.tile.miss{border:1px dashed var(--warn)}
.tile.wrong{background:var(--bad-soft);border-color:var(--bad)}
.tile .note{display:block;font-family:var(--f-mono);font-style:normal;font-size:12px;color:var(--muted);margin-top:6px}
.tile[disabled]{cursor:default}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.list li{border-left:2px solid var(--accent);padding-left:12px}
.ctx{background:var(--accent-soft);border-radius:8px;padding:12px 14px}

/* bank */
.filters{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
@media (max-width:560px){.filters{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:8px 14px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.entry{display:grid;grid-template-columns:44px 1fr;gap:12px;border-top:1px solid var(--line);padding:16px 0}
.num{font-family:var(--f-display);font-size:30px;color:var(--accent);line-height:1}
.pips{display:flex;gap:3px;margin-top:6px}
.pips i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--accent)}
.cover{display:block;width:100%;text-align:left;border:1px dashed var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;color:var(--muted);font-family:var(--f-mono);font-size:12px}
.notes{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:15px}
.notes dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.notes dd{margin:0}
.danger{color:var(--bad)}
.big{font-family:var(--f-display);font-size:56px;line-height:1}
.ai-box{border:1px solid var(--accent);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.ai-box h4{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:500}
.ai-box ul{margin:0;padding-left:18px}
.ai-box .model{font-family:var(--f-display);font-style:italic;font-size:18px;border-left:2px solid var(--accent);padding-left:10px}
.lvl{display:flex;gap:4px}.lvl i{width:26px;height:8px;border-radius:2px;background:var(--line)}.lvl i.on{background:var(--accent)}
.syncchip{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.syncchip.on{color:var(--good)}
.focus{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
@media (max-width:620px){.focus{grid-template-columns:1fr 1fr}.focus .fcount{grid-column:1/-1}}
.focus select{padding:8px 10px}
.fcount{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.fcount b{font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--ink);line-height:1}
.fcount button{background:none;border:none;padding:0;color:var(--accent);font-family:var(--f-mono);font-size:12px;text-decoration:underline}
.candle.off{opacity:.25}
.grp{font-size:26px;margin-top:18px;display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.grp .mono{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">GCSE English Literature · Macbeth</div>
    <div class="toprow">
      <div>
        <h1>Macbeth <em>Recall</em></h1>
        <p class="tag" style="margin:6px 0 0">24 quotations. Say them before you see them.</p>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="candles" id="candles" role="img"></div>
    <div class="candlekey mono"><span>#1 Act 1 · <span class="syncchip" id="sync">Saved on this device</span></span><span>Each candle is one quotation. Taller = more secure.</span><span>#24 Act 5</span></div>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<script>
/* ---------- DATA (from Macbeth Quote Bank; [[ ]] = underlined key word) ---------- */
const Q=[
{n:1,q:"[[Fair]] is [[foul]], and foul is fair",ref:"A1S1",who:"Witches",g:"The Witches",method:"Chiasmus + chant",meaning:"Good and evil are flipped, so nothing is what it seems",themes:["supernatural","appearance vs reality"]},
{n:2,q:"For [[brave]] Macbeth—well he deserves that name",ref:"A1S2",who:"Captain",g:"Captain",method:"Adjective + praise from others",meaning:"He starts as a hero, so his fall is more tragic",themes:["tragic hero"]},
{n:3,q:"All hail, Macbeth, that [[shalt]] be king hereafter!",ref:"A1S3",who:"Third Witch",g:"The Witches",method:"Prophecy + modal verb",meaning:"Sounds like fate, but they never tell him to murder",themes:["fate vs free will","ambition","kingship and tyranny"]},
{n:4,q:"The [[instruments of darkness]] tell us truths… to betray's / In deepest consequence",ref:"A1S3",who:"Banquo",g:"Banquo",method:"Metaphor + Banquo as a foil",meaning:"Evil wins trust with small truths, then destroys; Macbeth ignores this",themes:["supernatural","appearance vs reality","fate vs free will"]},
{n:5,q:"It is too full o' th' [[milk]] of human kindness",ref:"A1S5",who:"Lady Macbeth",g:"Lady Macbeth",method:"Metaphor (milk = feminine)",meaning:"She sees kindness as weakness; ironic, as he becomes a \"butcher\" (#24)",themes:["masculinity and gender"]},
{n:6,q:"[[unsex]] me here",ref:"A1S5",who:"Lady Macbeth",g:"Lady Macbeth",method:"Imperative, calling on spirits",meaning:"Rejects womanhood to be cruel; witch-like to a Jacobean audience",themes:["masculinity and gender","supernatural","ambition"]},
{n:7,q:"look like th' innocent flower, / But be the [[serpent]] under't",ref:"A1S5",who:"Lady Macbeth",g:"Lady Macbeth",method:"Contrasting imagery + biblical allusion (serpent in Eden)",meaning:"Hide evil behind innocence; links her to Satan",themes:["appearance vs reality","ambition"]},
{n:8,q:"I have no spur / To prick the sides of my intent, but only / [[Vaulting]] ambition",ref:"A1S7",who:"Macbeth",g:"Macbeth",method:"Extended metaphor of horse-riding",meaning:"Ambition is his only motive; vaulting = jumping too high, then falling",themes:["ambition","fate vs free will"]},
{n:9,q:"I have given suck… [[dash'd]] the brains out",ref:"A1S7",who:"Lady Macbeth",g:"Lady Macbeth",method:"Violent imagery vs motherhood",meaning:"She'd kill her own baby; rejects her role as a woman",themes:["masculinity and gender","violence","ambition"],alt:{"dash'd":["dashed"]}},
{n:10,q:"Is this a [[dagger]] which I see before me",ref:"A2S1",who:"Macbeth",g:"Macbeth",method:"Rhetorical question in a soliloquy",meaning:"Guilt breaks his mind before the murder; is it real or imagined?",themes:["guilt","supernatural","appearance vs reality"]},
{n:11,q:"Macbeth does murder [[sleep]]",ref:"A2S2",who:"Macbeth",g:"Macbeth",method:"Metaphor + third person",meaning:"Sleep = innocence; foreshadows the sleepwalking",themes:["guilt","kingship and tyranny"]},
{n:12,q:"A [[little]] water clears us of this deed",ref:"A2S2",who:"Lady Macbeth",g:"Lady Macbeth",method:"Understatement + dramatic irony",meaning:"She thinks guilt washes away easily; pairs with #20",themes:["guilt","appearance vs reality"]},
{n:13,q:"O, full of [[scorpions]] is my mind, dear wife!",ref:"A3S2",who:"Macbeth",g:"Macbeth",method:"Animal imagery",meaning:"Constant, poisonous paranoia; pushes him to kill again",themes:["guilt","kingship and tyranny"]},
{n:14,q:"I am in blood / Stepp'd in so far that, should I wade no more, / Returning were as [[tedious]] as go o'er",ref:"A3S4",who:"Macbeth",g:"Macbeth",method:"Extended metaphor of a river of blood",meaning:"Past the point of no return; murder is now routine",themes:["violence","kingship and tyranny"]},
{n:15,q:"[[security]] / Is mortals' chiefest enemy",ref:"A3S5",who:"Hecate",g:"Hecate",method:"Personification + superlative",meaning:"Security = overconfidence; foreshadows Act 5",themes:["supernatural","tragic hero"]},
{n:16,q:"Something [[wicked]] this way comes",ref:"A4S1",who:"Second Witch",g:"The Witches",method:"Rhyming couplet + Witches judging Macbeth",meaning:"Even the Witches call him wicked; shows how far he has fallen",themes:["supernatural","tragic hero"]},
{n:17,q:"none of [[woman born]] / Shall harm Macbeth",ref:"A4S1",who:"Apparition",g:"An Apparition",method:"Equivocation + dramatic irony",meaning:"Makes him feel untouchable, but Macduff was born by caesarean",themes:["fate vs free will","supernatural","appearance vs reality"]},
{n:18,q:"[[Bleed]], bleed, poor country!",ref:"A4S3",who:"Macduff",g:"Macduff",method:"Repetition + personification",meaning:"Scotland is a wounded body under a tyrant",themes:["kingship and tyranny","violence"]},
{n:19,q:"But I must also [[feel]] it as a man",ref:"A4S3",who:"Macduff",g:"Macduff",method:"Contrast + Macduff as a foil",meaning:"Real men grieve; shows up Macbeth's cold masculinity",themes:["masculinity and gender","violence"]},
{n:20,q:"Out, damned [[spot]]! out, I say!",ref:"A5S1",who:"Lady Macbeth",g:"Lady Macbeth",method:"Exclamations + imperatives, in prose",meaning:"She can't command a stain; prose shows her mind has broken",themes:["guilt"]},
{n:21,q:"She should have died [[hereafter]]",ref:"A5S5",who:"Macbeth",g:"Macbeth",method:"Short, flat statement + ambiguity",meaning:"Cold reaction to his wife's death; ambition has killed his feelings",themes:["tragic hero","relationships"]},
{n:22,q:"Life's but a walking [[shadow]]",ref:"A5S5",who:"Macbeth",g:"Macbeth",method:"Metaphor",meaning:"Shadow = empty; ambition left him with nothing",themes:["ambition","tragic hero"]},
{n:23,q:"[[Lay on]], Macduff",ref:"A5S8",who:"Macbeth",g:"Macbeth",method:"Imperative + short, blunt words",meaning:"He fights to the end; a flicker of the brave soldier from #2",themes:["tragic hero","masculinity and gender"]},
{n:24,q:"this dead [[butcher]] and his [[fiend-like]] queen",ref:"FINAL",who:"Malcolm",g:"Malcolm",method:"Dehumanising metaphors",meaning:"How they are remembered: a murderer and a demon, not a king and queen",themes:["kingship and tyranny","masculinity and gender"]}
];
const CTX=[
{name:"King James I",text:"Believed in witches (Daemonologie, 1597) and was descended from Banquo.",links:[1,4,6,16]},
{name:"Divine right of kings",text:"God chose the king, so killing one is a sin.",links:[11,18,24]},
{name:"Gunpowder Plot, 1605",text:"A plot to kill James; the plotters were linked with equivocation.",links:[4,17]},
{name:"Jacobean women",text:"Expected to be gentle and obedient.",links:[5,6,9,24]},
{name:"Tragic hero",text:"A fatal flaw (hamartia), here ambition.",links:[2,8,22,23]}
];

function mergeState(a,b){const out={...a,cards:{...a.cards}};
  for(const k of Object.keys(b.cards||{})){const x=a.cards[k]||{right:0,wrong:0},y=b.cards[k];out.cards[k]=(y.right+y.wrong)>(x.right+x.wrong)?y:x}
  out.streak=Math.max(a.streak||0,b.streak||0);out.last=(a.last||"")>(b.last||"")?a.last:b.last;
  out.best={...a.best};for(const k in (b.best||{}))out.best[k]=Math.max(out.best[k]||0,b.best[k]);return out}

    btn.disabled=true;btn.textContent="Marking…";
    const prompt=`You are a rigorous but encouraging GCSE English Literature examiner (AQA-style mark scheme) marking a 15-16 year old's short analysis of a quotation from Shakespeare's Macbeth.
TASK: ${task}
QUOTATION: "${plain(x.q)}" (${x.who}, ${refTxt(x.ref)})
REVISION-BANK NOTES (reference, not the only valid reading): method: ${x.method}; meaning: ${x.meaning}; themes: ${x.themes.join(", ")}.${CTX.filter(c=>c.links.includes(x.n)).map(c=>` Linked context: ${c.name} - ${c.text}`).join("")}

Judge against: AO1 clear response with the quotation used; AO2 naming a method, zooming in on a single word, and explaining its effect; AO3 relevant context. Level 1 = simple/basic, 2 = clear, 3 = thoughtful and developed, 4 = convincing and critical. Credit valid ideas that differ from the notes. Never invent quotations. British spelling.
Reply with ONLY JSON: {"level":1-4,"verdict":"one sentence","strengths":["max 2 items, under 18 words each"],"improve":["max 2 specific next steps, under 18 words each"],"zoom":"one word from the quotation to zoom in on and why, under 20 words","model":"the student's own point rewritten at level 4 in at most 2 sentences"}`;

function dayStr(d=new Date()){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}

/* ---------- FOCUS: filter by character, theme, act ---------- */
const CAST=[["Macbeth",x=>x.who==="Macbeth"],["Lady Macbeth",x=>x.who==="Lady Macbeth"],["Witches & spirits",x=>["Witches","Third Witch","Second Witch","Hecate","Apparition"].includes(x.who)],["Macduff",x=>x.who==="Macduff"],["Banquo, Captain & Malcolm",x=>["Banquo","Captain","Malcolm"].includes(x.who)]];
let FOCUS={who:"all",theme:"all",act:"all"};
try{const f=JSON.parse(localStorage.getItem("macbeth-focus")||"null");if(f)FOCUS={...FOCUS,...f}}catch(e){}
function inFocus(x){
  if(FOCUS.who!=="all"){const c=CAST.find(c=>c[0]===FOCUS.who);if(c&&!c[1](x))return false}
  if(FOCUS.theme!=="all"&&!x.themes.includes(FOCUS.theme))return false;
  if(FOCUS.act!=="all"&&(x.ref==="FINAL"?5:+x.ref[1])!==+FOCUS.act)return false;
  return true}
const focusOn=()=>FOCUS.who!=="all"||FOCUS.theme!=="all"||FOCUS.act!=="all";
function pool(min=1){const p=Q.filter(inFocus).map(x=>x.n);return p.length>=min?p:Q.map(x=>x.n)}
function focusBar(){
  const n=Q.filter(inFocus).length, opt=(v,l,cur)=>`<option value="${v}" ${String(cur)===String(v)?"selected":""}>${l}</option>`;
  const cnt=f=>Q.filter(x=>{const o=FOCUS;FOCUS={...o,...f};const r=inFocus(x);FOCUS=o;return r}).length;
  return `<div class="focus" role="group" aria-label="Choose which quotations to revise">
   <div><label class="lbl" for="fwho">Character</label><select id="fwho">${opt("all","Everyone",FOCUS.who)}${CAST.map(c=>opt(c[0],`${c[0]} (${cnt({who:c[0]})})`,FOCUS.who)).join("")}</select></div>
   <div><label class="lbl" for="ftheme">Theme</label><select id="ftheme">${opt("all","All themes",FOCUS.theme)}${THEMES.map(t=>opt(t,`${t} (${cnt({theme:t})})`,FOCUS.theme)).join("")}</select></div>
   <div><label class="lbl" for="fact">Act</label><select id="fact">${opt("all","Whole play",FOCUS.act)}${[1,2,3,4,5].map(a=>opt(a,`Act ${["","I","II","III","IV","V"][a]} (${cnt({act:a})})`,FOCUS.act)).join("")}</select></div>
   <div class="fcount"><b>${n}</b>${n===1?"quote":"quotes"} in focus${focusOn()?`<button id="fclear">Clear filters</button>`:""}</div></div>`}
function wireFocus(rerender){
  const set=(k,v)=>{FOCUS[k]=v;try{localStorage.setItem("macbeth-focus",JSON.stringify(FOCUS))}catch(e){}renderHeader();const y=window.scrollY;rerender();window.scrollTo(0,y)};
  const w=document.getElementById("fwho");if(!w)return;
  w.onchange=e=>set("who",e.target.value);
  document.getElementById("ftheme").onchange=e=>set("theme",e.target.value);
  document.getElementById("fact").onchange=e=>set("act",e.target.value);
  const c=document.getElementById("fclear");if(c)c.onclick=()=>{FOCUS={who:"all",theme:"all",act:"all"};set("who","all")};
}
function focusNote(){if(!focusOn())return"";const n=Q.filter(inFocus).length;return`<span class="mono">Focus: ${[FOCUS.who!=="all"?FOCUS.who:"",FOCUS.theme!=="all"?FOCUS.theme:"",FOCUS.act!=="all"?"Act "+FOCUS.act:""].filter(Boolean).map(esc).join(" · ")} (${n})</span>`}

/* ---------- HELPERS ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plain=q=>q.replace(/\[\[|\]\]/g,"");
const qHTML=q=>esc(q).replace(/\[\[(.+?)\]\]/g,"<u>$1</u>");
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const R=["","I","II","III","IV","V","VI","VII","VIII"];
function refTxt(ref){if(ref==="FINAL")return"Final scene";const m=ref.match(/A(\d)S(\d)/);return`Act ${m[1]} · Sc. ${m[2]}`}
function refMono(ref){if(ref==="FINAL")return"V.final";const m=ref.match(/A(\d)S(\d)/);return R[m[1]]+"."+R[m[2]].toLowerCase()}
const actOf=x=>x.ref==="FINAL"?5:+x.ref[1];
const whoLine=x=>`<span class="who"><b>${esc(x.who)}</b> · ${refTxt(x.ref)} · ${refMono(x.ref)}</span>`;
function weight(n){const c=S.cards[n];return (c.wrong+1)/(c.right+c.wrong+2)+(5-c.box)*0.12+(isDue(n)?0.3:0)}
function pickWeighted(pool,k){pool=[...pool];const out=[];while(out.length<k&&pool.length){const tot=pool.reduce((s,n)=>s+weight(n),0);let r=Math.random()*tot,i=0;for(;i<pool.length-1;i++){r-=weight(pool[i]);if(r<=0)break}out.push(pool.splice(i,1)[0])}return out}
const norm=w=>w.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z]/g,"");
const tokens=s=>s.replace(/[—…\/]/g," ").split(/\s+/).filter(t=>norm(t));
function lcsMatch(target,typed){const a=target.map(norm),b=typed.map(norm),m=a.length,n=b.length;const d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)d[i][j]=close(a[i],b[j])?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const hits=new Array(m).fill(false);let i=0,j=0;while(i<m&&j<n){if(close(a[i],b[j])){hits[i]=true;i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}return hits}
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function close(a,b){if(a===b)return true;if(a.length>=5&&b.length>=4)return lev(a,b)<=1;return false}
function scoreBadge(p){const c=p>=.9?"good":p>=.6?"mid":"low";return`<span class="score ${c}">${Math.round(p*100)}% recalled</span>`}
const STOP=new Set("the and that this with from into then them they their there what when which while about after again also because been before being both but can could does doing each every have having here him his her how its just more most much must not now only other over same she should some such than too very was were what who whom why will would your shows show used uses makes make".split(" "));
function keywords(text){return [...new Set(tokens(text).map(norm).filter(w=>w.length>3&&!STOP.has(w)))]}
function stemHit(w,typedSet){const s=w.slice(0,5);for(const t of typedSet){if(t.slice(0,5)===s)return true}return false}

/* ---------- DAILY RECALL ---------- */
let RS=null;
VIEWS.recall=()=>{
  let due=Q.filter(x=>isDue(x.n)&&inFocus(x)).map(x=>x.n);
  due.sort((a,b)=>S.cards[a].box-S.cards[b].box||Math.random()-.5);
  let queue=due.slice(0,10);
  if(!queue.length) queue=pickWeighted(pool(),8);
  RS={queue,i:0,rep:{},res:{1:[],2:[],3:[]},total:queue.length};
  nextRecall();
};
function cardType(n){const b=S.cards[n].box;const opts=b<=1?["finish","unpack"]:b<=3?["finish","name","unpack"]:["name","unpack"];return opts[Math.random()*opts.length|0]}
function nextRecall(){
  if(RS.i>=RS.queue.length)return recallDone();
  const n=RS.queue[RS.i], x=byN(n), type=cardType(n);
  RS.cur={n,type,themes:new Set()};
  const toks=tokens(plain(x.q)); const k=Math.max(1,Math.min(toks.length-2,Math.ceil(toks.length*.4)));
  RS.cur.k=k;
  let prompt="",input="";
  if(type==="finish"){
    prompt=`<div class="kind">Finish the line</div><p class="quote">“${esc(toks.slice(0,k).join(" "))} …”</p>${whoLine(x)}`;
    input=`<div><label class="lbl" for="ans">Type the rest from memory</label><textarea id="ans" rows="2" placeholder="…"></textarea></div>`;
  }else if(type==="name"){
    prompt=`<div class="kind">Name the quotation</div><dl class="cue"><dt>Who</dt><dd>${esc(x.who)} · ${refTxt(x.ref)}</dd><dt>Method</dt><dd>${esc(x.method)}</dd><dt>Meaning</dt><dd>${esc(x.meaning)}</dd></dl>`;
    input=`<div><label class="lbl" for="ans">Type the quotation word for word</label><textarea id="ans" rows="2"></textarea></div>`;
  }else{
    prompt=`<div class="kind">Unpack it</div><p class="quote">“${qHTML(x.q)}”</p>${whoLine(x)}`;
    input=`<div><label class="lbl" for="ans">Method and meaning, in your own words</label><textarea id="ans" rows="3" placeholder="Shakespeare uses … to show …"></textarea></div>
      <div><span class="lbl">Which themes does it fit?</span><div class="chips" id="tchips">${THEMES.map(t=>`<button class="chip" aria-pressed="false" data-t="${t}">${t}</button>`).join("")}</div></div>`;
  }
  $("#app").innerHTML=`<div class="wrap" style="gap:14px">
    <div class="bar">${backBtn}${focusNote()}<span class="mono">Card ${Math.min(RS.i+1,RS.queue.length)} of ${RS.queue.length} · #${n}</span></div>
    <div class="progress"><i style="width:${RS.i/RS.queue.length*100}%"></i></div>
    <section class="card">${prompt}${input}
      <div class="row end"><span class="mono" style="margin-right:auto">Enter to check</span><button class="btn primary" id="check">Check</button></div>
      <div id="reveal"></div>
    </section></div>`;
  const ans=$("#ans"); ans.focus();
  ans.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();revealRecall()}});
  $("#check").onclick=revealRecall;
  document.querySelectorAll("#tchips .chip").forEach(c=>c.onclick=()=>{const on=c.getAttribute("aria-pressed")!=="true";c.setAttribute("aria-pressed",on);on?RS.cur.themes.add(c.dataset.t):RS.cur.themes.delete(c.dataset.t)});
}
function revealRecall(){
  if(RS.cur.revealed)return; RS.cur.revealed=true;
  const {n,type,k}=RS.cur, x=byN(n), typed=$("#ans").value; $("#ans").readOnly=true; $("#check").hidden=true;
  let html="", p=0;
  if(type==="finish"||type==="name"){
    const all=tokens(plain(x.q)), target=type==="finish"?all.slice(k):all;
    const hits=lcsMatch(target,tokens(typed)); p=hits.filter(Boolean).length/target.length;
    const lead=type==="finish"?`<span>${esc(all.slice(0,k).join(" "))} </span>`:"";
    html+=`<div class="row">${scoreBadge(p)}<span class="mono">green = you had it · red = missed</span></div>
      <p class="quote diff">“${lead}${target.map((w,i)=>`<span class="${hits[i]?"hit":"gap"}">${esc(w)}</span>`).join(" ")}”</p>`;
    if(type==="finish")html+=`<dl class="notes"><dt>Method</dt><dd>${esc(x.method)}</dd><dt>Meaning</dt><dd>${esc(x.meaning)}</dd><dt>Themes</dt><dd>${esc(x.themes.join(", "))}</dd></dl>`;
    else html+=whoLine(x);
  }else{
    const kws=keywords(x.method+" "+x.meaning), typedSet=new Set(tokens(typed).map(norm));
    const kwHit=kws.filter(w=>stemHit(w,typedSet)).length;
    const right=new Set(x.themes), chosen=RS.cur.themes;
    const tOk=[...chosen].filter(t=>right.has(t)).length, tWrong=chosen.size-tOk;
    const tScore=Math.max(0,(tOk-tWrong*.5)/right.size);
    p=kws.length?(kwHit/kws.length)*.6+tScore*.4:tScore;
    document.querySelectorAll("#tchips .chip").forEach(c=>{const t=c.dataset.t,on=chosen.has(t);c.disabled=true;c.className="chip"+(right.has(t)?(on?" ok":" miss"):(on?" wrong":""));c.setAttribute("aria-pressed","false")});
    const mark=s=>esc(s).split(/(\s+)/).map(w=>{const nw=norm(w);return nw.length>3&&!STOP.has(nw)&&stemHit(nw,typedSet)?`<span class="hit">${w}</span>`:w}).join("");
    html+=`<div class="row"><span class="score ${p>=.7?"good":p>=.4?"mid":"low"}">${kwHit}/${kws.length} key words · ${tOk}/${right.size} themes${tWrong?` · ${tWrong} extra`:""}</span><span class="mono">dashed chip = theme you missed</span></div>
      <dl class="notes kw"><dt>Method</dt><dd>${mark(x.method)}</dd><dt>Meaning</dt><dd>${mark(x.meaning)}</dd></dl>`;
  }
  if(type==="unpack")html+=`<div id="ai"></div>`;
  const ctx=CTX.filter(c=>c.links.includes(n));

  const sug=p>=.85?3:p>=.5?2:1;
  html+=`<div><span class="lbl">How did you do? (keys 1 · 2 · 3)</span><div class="grades">
    <button class="grade g1 ${sug===1?"sugg":""}" data-g="1"><b>Forgot</b><small>back this round</small></button>
    <button class="grade g2 ${sug===2?"sugg":""}" data-g="2"><b>Shaky</b><small>tomorrow</small></button>
    <button class="grade g3 ${sug===3?"sugg":""}" data-g="3"><b>Got it</b><small>${INTERVAL[Math.min(5,S.cards[n].box+1)]||1} day${(INTERVAL[Math.min(5,S.cards[n].box+1)]||1)>1?"s":""}</small></button></div></div>`;
  const r=$("#reveal"); r.className="answer"; r.innerHTML=html;
  if(type==="unpack")aiBox("#ai",{x,answer:()=>typed,task:"Explain the method and meaning of this quotation."});
  r.querySelectorAll(".grade").forEach(b=>b.onclick=()=>gradeRecall(+b.dataset.g));
  r.querySelector(".grade.sugg").focus();
}
function gradeRecall(g){

}

/* ---------- GAP FILL ---------- */
let GS=null;
VIEWS.gap=()=>{GS={list:pickWeighted(pool(),8),i:0,score:0,miss:[]};gapCard()};
const GAP_SKIP=new Set("a an the is of in to and as at i o my me but be so us this that it his her he she shall should does which will thy thee th".split(" "));
function makeGaps(x){
  const parts=plain(x.q).split(/(\s+|—|…|\/)/), keys=new Set([...x.q.matchAll(/\[\[(.+?)\]\]/g)].flatMap(m=>m[1].split(/\s+/)).map(norm));
  const RX=/^([^A-Za-z]*)([A-Za-z](?:[A-Za-z'’-]*[A-Za-z])?)([^A-Za-z]*)$/;
  let idx=[],all=[];parts.forEach((p,i)=>{const m=p.match(RX);if(!m)return;all.push(i);const w=norm(m[2]);if(w.length>=3&&!GAP_SKIP.has(w))idx.push(i)});
  if(!idx.length)idx=all;
  const max=all.length<=4?1:all.length<=9?2:3, k=Math.min(idx.length,1+(Math.random()*max|0));
  let pick=shuffle(idx).slice(0,k);
  const keyIdx=idx.filter(i=>keys.has(norm(parts[i].match(RX)[2])));
  if(keyIdx.length&&Math.random()<.5&&!pick.some(i=>keyIdx.includes(i)))pick[0]=keyIdx[Math.random()*keyIdx.length|0];
  pick=[...new Set(pick)].sort((a,b)=>a-b);
  return {parts,pick,RX,ans:pick.map(i=>parts[i].match(RX)[2])};
}
function gapCard(){
  if(GS.i>=GS.list.length)return endScreen("Gap Fill",GS.score,GS.list.length,GS.miss,"gap");
  const x=byN(GS.list[GS.i]), G=makeGaps(x); GS.g=G; let bi=0;
  const body=G.parts.map((p,i)=>{if(!G.pick.includes(i))return esc(p);const m=p.match(G.RX);const w=m[2];
    return `${esc(m[1])}<input type="text" id="gap${bi}" data-i="${bi++}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="missing word ${bi}" style="width:${Math.max(4,w.length+2)}ch">${esc(m[3])}`}).join("");
  $("#app").innerHTML=`<div class="wrap" style="gap:14px"><div class="bar">${backBtn}${focusNote()}<span class="mono">${GS.i+1} of ${GS.list.length} · score ${GS.score}</span></div>
   <div class="progress"><i style="width:${GS.i/GS.list.length*100}%"></i></div>
   <section class="card"><div class="kind">Fill the ${bi>1?bi+" missing words":"missing word"}</div>
    <p class="quote gapq">“${body}”</p>
    <div id="hint"><button class="btn ghost" id="hintb">Show hint: speaker and meaning</button></div>
    <div class="row end"><span class="mono" style="margin-right:auto">Different words go missing every time</span><button class="btn primary" id="check">Check</button></div><div id="reveal"></div></section></div>`;
  const ins=[...document.querySelectorAll(".gapq input")]; ins[0].focus();
  ins.forEach((el,i)=>el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(GS.done)return gapNext();i<ins.length-1&&!ins[i+1].value?ins[i+1].focus():gapCheck()}}));
  $("#hintb").onclick=()=>{$("#hint").innerHTML=`${whoLine(x)}<p style="margin:4px 0 0">${esc(x.meaning)}</p>`;GS.hint=true};
  $("#check").onclick=gapCheck; GS.done=false; GS.hint=false;
}
function gapCheck(){
  if(GS.done)return gapNext(); GS.done=true;
  const x=byN(GS.list[GS.i]), ans=GS.g.ans;
  let all=true, spell=false, fixes=[];
  document.querySelectorAll(".gapq input").forEach((el,i)=>{
    const want=ans[i], got=norm(el.value), accept=[want,...((x.alt||{})[want.replace(/’/g,"'")]||[])].map(norm);
    let ok=accept.includes(got); if(!ok&&got&&accept.some(a=>a.length>=5&&lev(a,got)<=1)){ok=true;spell=true}
    el.readOnly=true; el.classList.add(ok?"ok":"bad"); if(!ok){all=false;fixes.push(want)}
  });
  if(all)GS.score++; else GS.miss.push(x.n); hit(x.n,all);
  $("#reveal").className="answer";
  $("#reveal").innerHTML=`${all?`<span class="score good">Correct${spell?" · check your spelling":""}</span>`:`<span class="fix">Answer: ${fixes.map(esc).join(", ")}</span>`}
   <p class="quote sm" style="margin:0">“${qHTML(x.q)}”</p>${whoLine(x)}<dl class="notes"><dt>Method</dt><dd>${esc(x.method)}</dd><dt>Meaning</dt><dd>${esc(x.meaning)}</dd></dl>`;
  $("#check").textContent="Next →"; $("#check").focus();
}

/* ---------- THEME HUNT + CONTEXT LINKS ---------- */
let HS=null;
VIEWS.theme=()=>hunt("theme"); VIEWS.context=()=>hunt("context");
function hunt(kind){
  let label,sub,matches;
  if(kind==="theme"){const ok=THEMES.filter(t=>Q.filter(x=>x.themes.includes(t)).length>=2);const t=ok[Math.random()*ok.length|0];label=t;matches=Q.filter(x=>x.themes.includes(t)).map(x=>x.n);sub="Select every quotation tagged with this theme."}
  else{const c=CTX[Math.random()*CTX.length|0];label=c.name;sub=c.text;matches=c.links}
  const size=kind==="theme"?8:6;

  const others=shuffle(Q.map(x=>x.n).filter(n=>!matches.includes(n))).slice(0,size-pickM.length);
  HS={kind,label,sub,set:new Set(pickM),tiles:shuffle([...pickM,...others]),sel:new Set(),done:false,round:(HS&&HS.kind===kind?HS.round:0)+1,total:(HS&&HS.kind===kind?HS.total:0)};

   <div class="row end"><span class="mono" style="margin-right:auto" id="hres"></span><button class="btn primary" id="check">Check</button></div><div id="reveal"></div></section></div>`;
  document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{if(HS.done)return;const n=+t.dataset.n,on=!HS.sel.has(n);on?HS.sel.add(n):HS.sel.delete(n);t.setAttribute("aria-pressed",on)});

    $("#model").onclick=()=>{const typedSet=new Set(tokens($("#para").value).map(norm)),kws=keywords(f.method+" "+f.meaning),k=kws.filter(w=>stemHit(w,typedSet)).length,ctx=CTX.filter(c=>c.links.includes(f.n));
      $("#reveal").innerHTML=`<span class="score ${k/kws.length>=.5?"good":"mid"}">${k}/${kws.length} key ideas mentioned</span>
       <dl class="notes"><dt>Method</dt><dd>${esc(f.method)}</dd><dt>Meaning</dt><dd>${esc(f.meaning)}</dd><dt>Themes</dt><dd>${esc(f.themes.join(", "))}</dd></dl>
       ${ctx.length?`<div class="ctx"><span class="eyebrow">Context to add</span><br>${ctx.map(c=>`<b>${esc(c.name)}:</b> ${esc(c.text)}`).join("<br>")}</div>`:`<p class="mono" style="margin:0">No context point is linked to this quotation in the bank.</p>`}
       <div id="ai2"></div>
       <div class="row"><button class="btn primary" onclick="go('exam')">New question</button><button class="btn" onclick="go('home')">Done</button></div>`;
      $("#model").hidden=true;
      aiBox("#ai2",{x:f,answer:()=>$("#para").value,task:"Essay question: "+ES.stem+" "+ES.t+" in Macbeth? The student chose quotations "+ES.sel.map(n=>"#"+n).join(", ")+" and wrote one analytical sentence on this one."});};
  }
}

/* ---------- QUOTE BANK ---------- */
function groups(list){
  if(BS.group==="act")return [1,2,3,4,5].map(a=>["Act "+R[a],list.filter(x=>actOf(x)===a)]).filter(g=>g[1].length);
  if(BS.group==="who")return CAST.map(c=>[c[0],list.filter(c[1])]).filter(g=>g[1].length);
  if(BS.group==="theme")return THEMES.map(t=>[t[0].toUpperCase()+t.slice(1),list.filter(x=>x.themes.includes(t))]).filter(g=>g[1].length);
  return list.length?[["",list]]:[]}
const covered=(n,part)=>BS.cover===part&&!BS.open.has(n+part);
function entry(x){const c=S.cards[x.n];return`<div class="entry"><div><div class="num">${x.n}</div><div class="pips" title="level ${c.box}/5">${[1,2,3,4,5].map(i=>`<i class="${c.box>=i?"on":""}"></i>`).join("")}</div></div><div style="min-width:0">
     ${covered(x.n,"quote")?`<button class="cover" data-o="${x.n}quote">Say the quotation, then tap to check · ${esc(x.who)}, ${refTxt(x.ref)}</button>`:`<p class="quote sm" style="margin:0">“${qHTML(x.q)}”</p>`}
     <div style="margin-top:4px">${whoLine(x)} <span class="mono">· ${c.right}✓ ${c.wrong}✗</span></div>
     ${covered(x.n,"notes")?`<button class="cover" style="margin-top:8px" data-o="${x.n}notes">Say the method, meaning and themes, then tap to check</button>`:`<dl class="notes"><dt>Method</dt><dd>${esc(x.method)}</dd><dt>Meaning</dt><dd>${esc(x.meaning)}</dd><dt>Themes</dt><dd>${esc(x.themes.join(", "))}</dd></dl>`}
   </div></div>`}
let BS={cover:"none",group:"act",open:new Set()};
VIEWS.bank=()=>{
  const list=Q.filter(inFocus);
  $("#app").innerHTML=`<div class="wrap" style="gap:14px"><div class="bar">${backBtn}</div>
   <section class="card"><div class="kind">Quote Bank</div>
   ${focusBar()}
   <div class="row" style="gap:18px"><div><span class="lbl">Group by</span><div class="seg" id="gseg">${[["act","Act"],["who","Character"],["theme","Theme"],["none","Number"]].map(([v,l])=>`<button aria-pressed="${BS.group===v}" data-g="${v}">${l}</button>`).join("")}</div></div>
    <div><span class="lbl">Cover</span><div class="seg">${[["none","Nothing"],["quote","Quotes"],["notes","Notes"]].map(([v,l])=>`<button aria-pressed="${BS.cover===v}" data-c="${v}">${l}</button>`).join("")}</div></div></div>
   <div>${groups(list).map(([g,items])=>`${g?`<h3 class="grp">${esc(g)} <span class="mono">${items.length} quote${items.length>1?"s":""}</span></h3>`:""}${items.map(entry).join("")}`).join("")||`<p class="muted">No quotations match these filters. Try clearing one.</p>`}</div>
   <div class="answer"><span class="kind">Context</span><ul class="list">${CTX.map(c=>`<li><b>${esc(c.name)}:</b> ${esc(c.text)} <span class="mono">Use with ${c.links.map(n=>"#"+n).join(", ")}</span></li>`).join("")}</ul></div>
   <div class="row" data-dl ${CAP.downloads?"":"hidden"}><button class="btn" id="dldeck">Export flashcards (CSV for Anki or Quizlet)</button><button class="btn" id="dlweak">Export my weakest 8</button><span class="mono" id="dlmsg"></span></div>
   <div class="row" id="resetrow"><button class="btn ghost danger" id="reset">Reset my progress</button></div>
   </section></div>`;
  wireFocus(VIEWS.bank);
  document.querySelectorAll("#gseg button").forEach(b=>b.onclick=()=>{BS.group=b.dataset.g;const y=window.scrollY;VIEWS.bank();window.scrollTo(0,y)});
  document.querySelectorAll(".seg:not(#gseg) button").forEach(b=>b.onclick=()=>{BS.cover=b.dataset.c;BS.open.clear();const y=window.scrollY;VIEWS.bank();window.scrollTo(0,y)});
  document.querySelectorAll(".cover").forEach(b=>b.onclick=()=>{BS.open.add(b.dataset.o);const y=window.scrollY;VIEWS.bank();window.scrollTo(0,y)});
  $("#dldeck").onclick=()=>exportFile("deck");$("#dlweak").onclick=()=>exportFile("weak");
  $("#reset").onclick=()=>{$("#resetrow").innerHTML=`<span>This clears all levels, scores and your streak.</span><button class="btn primary" id="yes">Yes, reset</button><button class="btn" id="no">Cancel</button>`;
    $("#yes").onclick=()=>{S=blank();save();go("home")};$("#no").onclick=()=>VIEWS.bank()};
};

go("home");
</script>
